<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceNursy - 護理聲助手</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app" class="app-container">
        <!-- 頂部導航 -->
        <header class="header">
            <h1>🏥 VoiceNursy 護理聲助手</h1>
            <div class="header-info">
                <span id="nurse-name">護理師：王小明</span>
                <span id="shift-info">日班 07:00-15:00</span>
            </div>
        </header>

        <!-- 警示覆蓋層 -->
        <div id="alert-overlay" class="alert-overlay hidden">
            <div class="alert-box">
                <div class="alert-icon">⚠️</div>
                <h2>劑量異常警示</h2>
                <p id="alert-message"></p>
                <div class="alert-detail">
                    <span>偵測值：<strong id="alert-detected"></strong></span>
                    <span>常規範圍：<strong id="alert-range"></strong></span>
                </div>
                <div class="alert-actions">
                    <button class="btn btn-danger" onclick="acknowledgeAlert()">確認知悉並繼續</button>
                    <button class="btn btn-primary" onclick="editSOAP()">修改數值</button>
                </div>
            </div>
        </div>

        <!-- 主要內容區 -->
        <main class="main-content">
            <!-- 左側：SOAP 卡片 -->
            <section class="soap-section">
                <h2>📋 SOAP 護理紀錄</h2>

                <!-- 模擬輸入區 -->
                <div class="input-area">
                    <textarea id="raw-input" placeholder="在此輸入或貼上語音轉錄文字（模擬角色 A 的輸出）..."></textarea>
                    <button class="btn btn-primary" onclick="processInput()">🧠 送出給 AI 處理</button>
                    <button class="btn btn-secondary" onclick="loadDemo()">📝 載入範例</button>
                </div>

                <!-- SOAP 卡片 -->
                <div id="soap-cards" class="soap-cards hidden">
                    <div class="soap-card soap-s">
                        <div class="soap-label">S 主觀</div>
                        <div id="soap-s" class="soap-content" contenteditable="true"></div>
                    </div>
                    <div class="soap-card soap-o">
                        <div class="soap-label">O 客觀</div>
                        <div id="soap-o" class="soap-content" contenteditable="true"></div>
                    </div>
                    <div class="soap-card soap-a">
                        <div class="soap-label">A 評估</div>
                        <div id="soap-a" class="soap-content" contenteditable="true"></div>
                    </div>
                    <div class="soap-card soap-p">
                        <div class="soap-label">P 計畫</div>
                        <div id="soap-p" class="soap-content" contenteditable="true"></div>
                    </div>

                    <!-- 藥物資訊 -->
                    <div id="medications-section" class="medications-section hidden">
                        <h3>💊 藥物資訊</h3>
                        <div id="medications-list"></div>
                    </div>

                    <!-- Pain Scale -->
                    <div id="pain-section" class="pain-section hidden">
                        <h3>😣 疼痛指數</h3>
                        <div id="pain-display" class="pain-display"></div>
                    </div>

                    <!-- 確認存檔 -->
                    <div class="confirm-area">
                        <button class="btn btn-success btn-large" onclick="confirmSave()">✅ 確認存檔</button>
                    </div>
                </div>

                <!-- 存檔成功動畫 -->
                <div id="save-animation" class="save-animation hidden">
                    <div class="checkmark">✓</div>
                    <p>病歷已成功歸檔</p>
                </div>
            </section>

            <!-- 右側：視覺化儀表板 -->
            <section class="dashboard-section">
                <h2>📊 交班儀表板</h2>

                <!-- 疼痛趨勢圖 -->
                <div class="chart-container">
                    <h3>疼痛趨勢圖</h3>
                    <canvas id="pain-chart"></canvas>
                </div>

                <!-- 給藥時間軸 -->
                <div class="timeline-container">
                    <h3>給藥時間軸</h3>
                    <div id="medication-timeline"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="safety_check.js"></script>
    <script src="charts.js"></script>
    <script src="app.js"></script>
</body>
</html>
